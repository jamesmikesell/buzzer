<div class="scoreboard-entry" *ngIf="!connected">
  <form class="entry-form" (ngSubmit)="connect()">
    <h1>Scoreboard</h1>

    <mat-form-field>
      <mat-label>Room Name</mat-label>
      <input matInput type="password" [(ngModel)]="roomName" name="roomName" required
        #uxRoomName="ngModel" autocomplete="off" (focusout)="cleanRoomName()">
      <mat-error *ngIf="uxRoomName.hasError('required')">Required</mat-error>
      <mat-icon matPrefix>lock</mat-icon>
    </mat-form-field>

    <button mat-raised-button color="primary" type="submit" [disabled]="!roomName || connecting">
      {{connecting ? 'connecting...' : 'connect'}}
    </button>

    <div class="entry-error" *ngIf="connectionError">{{connectionError}}</div>
  </form>
</div>

<div class="scoreboard-shell" *ngIf="connected" [style.--player-count]="players.length || 1"
  [class.cursor-hidden]="cursorHidden" (pointermove)="showFullscreenButton()">
  <header class="scoreboard-header">
    <div>Rank</div>
    <div>Player</div>
    <div>Score</div>
  </header>

  <main class="scoreboard-list" *ngIf="players.length">
    <section class="scoreboard-row" *ngFor="let player of players" [class.tie]="player.tie"
      [class.tie-start]="player.tieStart" [class.tie-end]="player.tieEnd">
      <div class="rank">{{player.rank}}</div>
      <div class="player-name">{{player.name}}</div>
      <div class="score">{{player.score}}</div>
    </section>
  </main>

  <main class="empty-scoreboard" *ngIf="!players.length">
    Waiting for scores
  </main>

  <button type="button" class="fullscreen-button" [class.visible]="fullscreenButtonVisible"
    (click)="toggleFullscreen($event)" [attr.aria-label]="isFullscreen ? 'Exit fullscreen' : 'Show fullscreen'">
    <mat-icon>{{isFullscreen ? 'fullscreen_exit' : 'aspect_ratio'}}</mat-icon>
    <span>{{isFullscreen ? 'exit fullscreen' : 'show fullscreen'}}</span>
  </button>
</div>
